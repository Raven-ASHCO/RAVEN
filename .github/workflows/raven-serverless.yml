# Raven serverless node CI — raven-core / ash / raven-swarm / protocol vectors
# Local workflow file (§57). Not pushed unless the user requests.
name: Raven Serverless Node

on:
  push:
    paths:
      - "node/**"
      - "protocol/**"
      - "shared-vectors/**"
      - "ios-native/RAVEN/Libp2pBridge/**"
      - "ios-native/RAVEN/RAVEN/Core/Config/FeatureFlags.swift"
      - "ios-native/RAVEN/RAVEN/Core/Protocol/**"
      - "ios-native/RAVEN/RAVEN/Core/Mesh/**"
      - "ios-native/RAVEN/RAVEN/Core/Transport/**"
      - "ios-native/RAVEN/RAVEN/Core/Messaging/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/ATSAM/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/LAN/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/MessageContentSealer.swift"
      - "ios-native/RAVEN/RAVEN.xcodeproj/**"
      - "ios-native/RAVEN/RAVEN/App/**"
      - "ios-native/RAVEN/RAVEN/Features/Contacts/**"
      - "ios-native/RAVEN/RAVEN/Features/QRCode/**"
      - "ios-native/RAVEN/RAVEN/Features/Settings/RavenServerlessLanSettingsView.swift"
      - "ios-native/RAVEN/RAVENTests/**"
      - "ios-native/RAVEN/RAVEN/**/*.swift"
      - "RAVEN-WatchApp/RAVEN-Watch/**/*.swift"
      - "node/scripts/ios_lan_kat.sh"
      - "node/scripts/ios_lan_lab_checklist.md"
      - "scripts/secret_history_scan.sh"
      - "docs/MIGRATION_SERVERLESS_V1.md"
      - ".github/workflows/raven-serverless.yml"
  pull_request:
    paths:
      - "node/**"
      - "protocol/**"
      - "shared-vectors/**"
      - "ios-native/RAVEN/Libp2pBridge/**"
      - "ios-native/RAVEN/RAVEN/Core/Config/FeatureFlags.swift"
      - "ios-native/RAVEN/RAVEN/Core/Protocol/**"
      - "ios-native/RAVEN/RAVEN/Core/Mesh/**"
      - "ios-native/RAVEN/RAVEN/Core/Transport/**"
      - "ios-native/RAVEN/RAVEN/Core/Messaging/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/ATSAM/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/LAN/**"
      - "ios-native/RAVEN/RAVEN/Core/Security/MessageContentSealer.swift"
      - "ios-native/RAVEN/RAVEN.xcodeproj/**"
      - "ios-native/RAVEN/RAVEN/App/**"
      - "ios-native/RAVEN/RAVEN/Features/Contacts/**"
      - "ios-native/RAVEN/RAVEN/Features/QRCode/**"
      - "ios-native/RAVEN/RAVEN/Features/Settings/RavenServerlessLanSettingsView.swift"
      - "ios-native/RAVEN/RAVENTests/**"
      - "ios-native/RAVEN/RAVEN/**/*.swift"
      - "RAVEN-WatchApp/RAVEN-Watch/**/*.swift"
      - "node/scripts/ios_lan_kat.sh"
      - "node/scripts/ios_lan_lab_checklist.md"
      - "scripts/secret_history_scan.sh"
      - "docs/MIGRATION_SERVERLESS_V1.md"
      - ".github/workflows/raven-serverless.yml"
  workflow_dispatch:

concurrency:
  group: raven-serverless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-product-boundary:
    name: Messaging-only product boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse public-social product regressions
        run: bash node/scripts/messaging_product_boundary_gate.sh

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run secret history scan (CI mode)
        run: bash scripts/secret_history_scan.sh --ci

  rust-linux:
    name: Rust + vectors (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          cargo clippy -p raven-core -p ash -p raven-node -p raven-swarm --all-targets -- -D warnings
          cargo clippy -p raven-swarm --all-features --all-targets -- -D warnings
      - name: RustSec active dependency audit
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          python3 -m unittest scripts/test_audit_active_dependencies.py
          python3 scripts/audit_active_dependencies.py
      - name: test raven-core + ash
        run: cargo test -p raven-core -p ash -p raven-node
      # CLI DX: menu/CLI smoke only (not Keychain / launchd / Gatekeeper).
      # Must stay on script-default target/debug/ash — locked-file is refused in Release.
      # Script uses RAVEN_IDENTITY_BACKEND=locked-file and ephemeral mktemp dirs.
      - name: ash menu smoke
        run: ./scripts/ash_menu_smoke.sh
      - name: LAN handshake KAT (shared vectors, no live network)
        run: cargo test -p raven-core --lib lan_
      # Must stay on script-default target/debug — locked-file is refused in Release.
      # Script uses RAVEN_IDENTITY_BACKEND=locked-file and
      # RAVEN_CHAT_HISTORY_BACKEND=locked-file so GNU/Linux SS connect-fail
      # can persist chat-history (not a production 0600-key fallback).
      - name: LAN direct two-node smoke
        run: ./scripts/lan_direct_two_node.sh
      - name: bridge + fuzz smoke
        run: cargo test -p raven-core --test bridge_v1 --test fuzz_smoke
      - name: 10,000-message queue reliability gate
        run: cargo test -p raven-core --test reliability_10k -- --ignored
      - name: Deterministic 1,000-node adversarial DTN simulation
        run: |
          cargo test -p raven-core --test network_sim_1000
          cargo test --release -p raven-core --test network_sim_1000
      - name: build swarm
        run: cargo build -p raven-swarm -p raven-node
      - name: experimental mailbox/NAT tests (still production-disabled)
        run: |
          set -euo pipefail
          expect_failure_with_message() {
            expected="$1"
            shift
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "security hold unexpectedly allowed command: $*" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- "$expected" "$log"; then
              echo "command failed without the expected security-hold diagnostic: $*" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          cargo test -p raven-swarm --all-features --all-targets
          cargo build --release -p raven-swarm \
            --features experimental-offline-mailbox \
            --bin raven-swarm-mailbox-experimental
          cargo build --release -p raven-swarm \
            --features experimental-nat-connectivity \
            --bin raven-swarm-connectivity-experimental
          expect_failure_with_message \
            "security hold: pass --allow-experimental-mailbox explicitly" \
            target/release/raven-swarm-mailbox-experimental \
            serve --data-dir target/ci-mailbox-security-hold --timeout-secs 1
          expect_failure_with_message \
            "experimental NAT connectivity requires explicit runtime opt-in" \
            target/release/raven-swarm-connectivity-experimental --run-seconds 1
      - name: release crypto feature gate
        run: |
          set -euo pipefail
          cargo build --release -p raven-core -p raven-node -p ash
          for package in raven-core raven-node ash; do
            log="$(mktemp)"
            if cargo build --release -p "$package" --features unsafe-demo-crypto >"$log" 2>&1; then
              echo "unsafe-demo-crypto unexpectedly linked into $package release" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- \
              "unsafe-demo-crypto is forbidden in release builds" "$log"; then
              echo "unsafe-demo-crypto gate for $package failed for an unrelated reason" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh
      - name: mailbox opaque put/get smoke
        run: ./scripts/mailbox_opaque_smoke.sh
      - name: libp2p offline mailbox restart smoke
        run: ./scripts/swarm_mailbox_smoke.sh
      - name: legacy Internet path remains fail-closed
        run: ./scripts/internet_dial_smoke.sh
      - name: protocol vectors (python)
        working-directory: protocol/reference
        run: |
          python3 -m pip install -q -r requirements.txt
          python3 -m pytest -q
          python3 generate_rvn1.py
          git diff --exit-code -- ../../shared-vectors/rvn1
          test -z "$(git ls-files --others --exclude-standard -- ../../shared-vectors/rvn1)"
      - name: SBOM (cargo tree + cyclonedx if available)
        run: |
          set -euo pipefail
          mkdir -p target/sbom
          cargo tree -p raven-core -p ash -p raven-node -p raven-swarm --prefix depth \
            > target/sbom/raven-cargo-tree.txt
          if cargo install --list 2>/dev/null | grep -q '^cargo-cyclonedx '; then
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json || true
          else
            cargo install cargo-cyclonedx --locked --version 0.5.7 || true
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json \
              || echo "cyclonedx optional — cargo-tree SBOM retained"
          fi
          test -s target/sbom/raven-cargo-tree.txt
          ls -la target/sbom/
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raven-sbom-linux
          path: node/target/sbom/
          if-no-files-found: error

  mlkem768-incremental-portable:
    name: ML-KEM-768 incremental (portable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    env:
      CARGO_TARGET_DIR: target/libcrux-portable
      LIBCRUX_DISABLE_SIMD128: "1"
      LIBCRUX_DISABLE_SIMD256: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test portable incremental ML-KEM-768
        run: cargo test -p raven-core --features mlkem768-incremental-lab --lib mlkem768_incremental
      - name: Dump portable Encaps1 state
        env:
          RAVEN_DUMP_ENCAPS1_STATE: "1"
          RAVEN_DUMP_ENCAPS1_STATE_PATH: ${{ github.workspace }}/node/target/libcrux-portable/mlkem768-encaps1-state.hex
        run: |
          set -euo pipefail
          rm -f "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
          cargo test -p raven-core --features mlkem768-incremental-lab \
            --lib mlkem768_incremental::feature_smoke::dump_mlkem768_incremental_encaps1_state \
            -- --exact --ignored
          test -s "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
      - name: Upload portable Encaps1 state
        uses: actions/upload-artifact@v4
        with:
          name: mlkem768-encaps1-portable
          path: node/target/libcrux-portable/mlkem768-encaps1-state.hex
          if-no-files-found: error
      - name: Guard against libcrux from_seed expansion
        run: |
          set -euo pipefail
          if grep -Fq -- \
            "KeyPairCompressedBytes::from_seed" \
            crates/raven-core/src/mlkem768_incremental.rs; then
            echo "forbidden KeyPairCompressedBytes::from_seed path found" >&2
            exit 1
          fi
      - name: Check incremental ML-KEM-768 fixture
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install -q -r protocol/reference/requirements.txt
          python3 -m pytest protocol/reference/tests/test_mlkem768_incremental_check.py -q
      - name: Build incremental ML-KEM-768 FFI (debug)
        run: cargo build -p raven-mlkem768-incremental-ffi
      - name: Release incremental ML-KEM-768 feature gate
        run: |
          set -euo pipefail
          log="$(mktemp)"
          if cargo build --release -p raven-core \
            --features mlkem768-incremental-lab >"$log" 2>&1; then
            echo "mlkem768-incremental-lab unexpectedly built in release mode" >&2
            rm -f "$log"
            exit 1
          fi
          if ! grep -Fq -- \
            "mlkem768-incremental-lab is forbidden in release builds" "$log"; then
            echo "mlkem768-incremental-lab release gate failed for an unrelated reason" >&2
            tail -n 80 "$log" >&2
            rm -f "$log"
            exit 1
          fi
          rm -f "$log"

  full-braid-lab:
    name: Full Braid Slice 2 lab
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    env:
      CARGO_TARGET_DIR: target/full-braid-lab
      LIBCRUX_DISABLE_SIMD128: "1"
      LIBCRUX_DISABLE_SIMD256: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          prefix-key: full-braid-lab
      - name: Test Full Braid (Rust)
        run: |
          cargo test -p raven-core --features full-braid-lab --lib hybrid_ratchet_v2_full_braid
          cargo test -p raven-core --features full-braid-lab --test adversarial_atsam
          cargo test -p raven-fb-ffi --lib
      - name: Clippy Full Braid
        run: |
          cargo clippy -p raven-core --features full-braid-lab --all-targets -- -D warnings
          cargo clippy -p raven-fb-ffi --all-targets -- -D warnings
      - name: rustfmt Full Braid
        run: |
          rustfmt --check crates/raven-core/src/hybrid_ratchet_v2_full_braid/*.rs
          rustfmt --check crates/raven-fb-ffi/src/lib.rs
      - name: Python Full Braid reference
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pip install -q -r protocol/reference/requirements.txt
          python3 -m pytest protocol/reference/tests/test_full_braid.py -q
      - name: Build Full Braid FFI (debug)
        run: cargo build -p raven-fb-ffi
      - name: Release Full Braid feature gate
        run: |
          set -euo pipefail
          core_log="$(mktemp)"
          if cargo build --release -p raven-core \
            --features full-braid-lab >"$core_log" 2>&1; then
            echo "full-braid-lab unexpectedly built in release mode" >&2
            rm -f "$core_log"
            exit 1
          fi
          if ! grep -Fq -- \
            "mlkem768-incremental-lab is forbidden in release builds" \
            "$core_log"; then
            echo "raven-core full-braid-lab release gate missed exact diagnostic" >&2
            tail -n 80 "$core_log" >&2
            rm -f "$core_log"
            exit 1
          fi
          rm -f "$core_log"

          ffi_log="$(mktemp)"
          if cargo build --release -p raven-fb-ffi --no-default-features >"$ffi_log" 2>&1; then
            echo "raven-fb-ffi unexpectedly built in release mode" >&2
            rm -f "$ffi_log"
            exit 1
          fi
          if ! grep -Fq -- \
            "raven-fb-ffi is lab-only and must not be linked in Release/App Store builds" \
            "$ffi_log"; then
            echo "raven-fb-ffi release gate missed exact diagnostic" >&2
            tail -n 80 "$ffi_log" >&2
            rm -f "$ffi_log"
            exit 1
          fi
          rm -f "$ffi_log"
      - name: Production remains off (vectors + no app callsites)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          for name in (
              "full_braid_sm_round_001.json",
              "full_braid_full_exchange_2pq_2dh_001.json",
          ):
              vector = root / "shared-vectors/rvn1/atsam" / name
              data = json.loads(vector.read_text())
              assert data.get("production_enabled") is False, (name, data.get("production_enabled"))
              assert data.get("lab_only") is True, (name, data.get("lab_only"))
          exchange = json.loads(
              (root / "shared-vectors/rvn1/atsam/full_braid_full_exchange_2pq_2dh_001.json").read_text()
          )
          assert len(exchange.get("aead_checkpoints") or []) == 4, "expected 4 AEAD checkpoints"
          app = root / "ios-native/RAVEN/RAVEN"
          hits = []
          for path in app.rglob("*.swift"):
              text = path.read_text(errors="ignore")
              if "ATSAMFullBraid" in text or "raven_fb_" in text or "RAVEN_FULL_BRAID_FFI" in text:
                  hits.append(str(path))
          if hits:
              raise SystemExit(f"Full Braid production callsites: {hits}")
          print("production_off OK")
          PY

  full-braid-lab-ios:
    name: Full Braid Slice 2 lab (iOS)
    runs-on: macos-14
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/node/target/full-braid-ios-lab
      LIBCRUX_DISABLE_SIMD128: "1"
      LIBCRUX_DISABLE_SIMD256: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          prefix-key: full-braid-lab-ios
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
      - name: Full Braid Swift FFI lab gate
        run: bash ./node/scripts/ios_full_braid_lab_gate.sh

  # Task 0A.5 — SQLCipher packaging aggregate stop-line (0A.1–0A.4).
  # Does not authorize Task 0B / production / commit.
  full-braid-task0a-provenance:
    name: Full Braid Task 0A provenance (0A.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hermetic SQLCipher regen/verify selftest
        working-directory: ${{ github.workspace }}
        env:
          RAVEN_0A5_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash ./node/scripts/full_braid_task0a_ci_gate.sh provenance

  full-braid-task0a-linux:
    name: Full Braid Task 0A Linux (0A.2/0A.4/0A.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    env:
      CARGO_TARGET_DIR: target/full-braid-task0a
      RAVEN_EXPECT_SQLCIPHER_4_17_0: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          prefix-key: full-braid-task0a-linux
      - name: Task 0A Linux CI gate
        working-directory: ${{ github.workspace }}
        env:
          RAVEN_0A5_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash ./node/scripts/full_braid_task0a_ci_gate.sh linux

  full-braid-task0a-macos:
    name: Full Braid Task 0A macOS + iOS (0A.2–0A.4)
    runs-on: macos-14
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/node/target/full-braid-task0a-macos
      RAVEN_EXPECT_SQLCIPHER_4_17_0: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          prefix-key: full-braid-task0a-macos
      - name: Task 0A macOS/iOS CI gate (incl. cross-provider)
        working-directory: ${{ github.workspace }}
        env:
          RAVEN_0A5_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash ./node/scripts/full_braid_task0a_ci_gate.sh macos

  full-braid-task0a-windows:
    name: Full Braid Task 0A Windows MSVC (0A.2/0A.4)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: node
        shell: bash
    env:
      CARGO_TARGET_DIR: target/full-braid-task0a-windows
      RAVEN_EXPECT_SQLCIPHER_4_17_0: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
          prefix-key: full-braid-task0a-windows
      - name: Task 0A Windows CI gate
        working-directory: ${{ github.workspace }}
        run: bash ./node/scripts/full_braid_task0a_ci_gate.sh windows

  mlkem768-incremental-avx2:
    name: ML-KEM-768 incremental (AVX2)
    runs-on: ubuntu-latest
    needs: mlkem768-incremental-portable
    defaults:
      run:
        working-directory: node
    env:
      CARGO_TARGET_DIR: target/libcrux-avx2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm AVX2 available
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          if ! grep -qw avx2 /proc/cpuinfo; then
            echo "AVX2 CPU feature required for this job; x86_64 alone is insufficient" >&2
            exit 1
          fi
      - name: Assert Rust runtime AVX2 detection
        env:
          RAVEN_REQUIRE_AVX2: "1"
        run: |
          cargo test -p raven-core --features mlkem768-incremental-lab \
            --lib mlkem768_incremental::feature_smoke::require_avx2_when_gated \
            -- --exact --nocapture
      - name: Test AVX2 incremental ML-KEM-768
        run: cargo test -p raven-core --features mlkem768-incremental-lab --lib mlkem768_incremental
      - name: Dump AVX2 Encaps1 state
        env:
          RAVEN_DUMP_ENCAPS1_STATE: "1"
          RAVEN_DUMP_ENCAPS1_STATE_PATH: ${{ github.workspace }}/node/target/libcrux-avx2/mlkem768-encaps1-state.hex
        run: |
          set -euo pipefail
          rm -f "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
          cargo test -p raven-core --features mlkem768-incremental-lab \
            --lib mlkem768_incremental::feature_smoke::dump_mlkem768_incremental_encaps1_state \
            -- --exact --ignored
          test -s "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
      - name: Download portable Encaps1 state
        uses: actions/download-artifact@v4
        with:
          name: mlkem768-encaps1-portable
          path: node/target/libcrux-portable
      - name: Compare portable and AVX2 Encaps1 states
        run: |
          diff -u \
            target/libcrux-portable/mlkem768-encaps1-state.hex \
            target/libcrux-avx2/mlkem768-encaps1-state.hex

  mlkem768-incremental-neon:
    name: ML-KEM-768 incremental (NEON)
    runs-on: macos-14
    needs: mlkem768-incremental-portable
    defaults:
      run:
        working-directory: node
    env:
      CARGO_TARGET_DIR: target/libcrux-neon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Test NEON incremental ML-KEM-768
        run: cargo test -p raven-core --features mlkem768-incremental-lab --lib mlkem768_incremental
      - name: Dump NEON Encaps1 state
        env:
          RAVEN_DUMP_ENCAPS1_STATE: "1"
          RAVEN_DUMP_ENCAPS1_STATE_PATH: ${{ github.workspace }}/node/target/libcrux-neon/mlkem768-encaps1-state.hex
        run: |
          set -euo pipefail
          rm -f "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
          cargo test -p raven-core --features mlkem768-incremental-lab \
            --lib mlkem768_incremental::feature_smoke::dump_mlkem768_incremental_encaps1_state \
            -- --exact --ignored
          test -s "$RAVEN_DUMP_ENCAPS1_STATE_PATH"
      - name: Download portable Encaps1 state
        uses: actions/download-artifact@v4
        with:
          name: mlkem768-encaps1-portable
          path: node/target/libcrux-portable
      - name: Compare portable and NEON Encaps1 states
        run: |
          diff -u \
            target/libcrux-portable/mlkem768-encaps1-state.hex \
            target/libcrux-neon/mlkem768-encaps1-state.hex

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: test raven-core + ash + swarm build
        run: |
          cargo test -p raven-core -p ash -p raven-node
          cargo test -p raven-core --lib lan_
          cargo build -p raven-swarm -p raven-node
          cargo build --release -p raven-core -p raven-node -p ash
      # CLI DX: menu/CLI smoke only (not Keychain / launchd / Gatekeeper).
      # Must stay on script-default target/debug/ash — locked-file is refused in Release.
      # locked-file avoids Keychain ACL hangs in CI — not a production Keychain claim.
      - name: ash menu smoke
        run: ./scripts/ash_menu_smoke.sh
      # Named reliability gates (Sprint 0 evidence bar). reliability_10k is
      # #[ignore] and is NOT run by the umbrella cargo test above.
      # reliability_10k on macOS is QUEUE DURABILITY ONLY — not a path proof.
      # Path proof: named bridge_v1 (this job) and/or ash_menu_smoke (CLI DX #16).
      - name: 10,000-message queue reliability gate
        run: |
          set -euo pipefail
          cargo test -p raven-core --test reliability_10k -- --ignored
      - name: bridge_v1 (pure Rust)
        run: |
          set -euo pipefail
          cargo test -p raven-core --test bridge_v1
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: node
      - name: test raven-core + ash (no bash smoke scripts)
        run: |
          cargo test -p raven-core -p ash -p raven-node
          cargo build -p raven-node -p raven-swarm -p ash
          cargo build --release -p raven-core -p raven-node -p ash
      # Named reliability gates (Sprint 0 evidence bar). cargo, not bash.
      # reliability_10k on Windows is QUEUE DURABILITY ONLY — not a path proof.
      # Path proof: named bridge_v1 + ash_doctor_send_smoke.ps1 (this job).
      - name: 10,000-message queue reliability gate
        run: cargo test -p raven-core --test reliability_10k -- --ignored
      - name: bridge_v1 (pure Rust)
        run: cargo test -p raven-core --test bridge_v1
      - name: ash doctor→send smoke (Windows terminal path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/ash_doctor_send_smoke.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Error "$script missing — refusing silent skip"
            exit 1
          }
          & $script
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PowerShell install script syntax check
        shell: pwsh
        run: |
          Get-Command Get-Content | Out-Null
          $p = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $p)) { throw "missing $p" }
          # Parse-only: ensure script is well-formed PowerShell
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $p), [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_ }; throw "parse errors" }
          Write-Host "windows_service.ps1 OK"
      # bash libp2p/bootstrap smokes are Linux/macOS-only on this workflow.

  go-bridge:
    name: Go libp2p bridge security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios-native/RAVEN/Libp2pBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ios-native/RAVEN/Libp2pBridge/go.mod
          cache-dependency-path: ios-native/RAVEN/Libp2pBridge/go.sum
      - name: Unit, adversarial, and race tests
        run: go test -count=1 -race ./...
      - name: Vet
        run: go vet ./...

  ios-security:
    name: iOS protocol security tests
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-native/RAVEN
    steps:
      - uses: actions/checkout@v4
      - name: Select an available iOS simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, d)
              for runtime, devices in data.items()
              for d in devices
              if d.get("isAvailable") and "iPhone" in d.get("name", "")
          ]
          if not candidates:
              raise SystemExit("no available iPhone simulator")
          # Runtime identifiers end in a dotted version with dashes. Prefer
          # the newest available runtime instead of relying on JSON order.
          def version(item):
              raw = item[0].rsplit("iOS-", 1)[-1]
              return tuple(int(part) for part in raw.split("-") if part.isdigit())
          print(max(candidates, key=version)[1]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and run protocol security tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -parallel-testing-enabled NO \
            -only-testing:RAVENTests/RavenEnvelopeV1VectorsTests \
            -only-testing:RAVENTests/RavenServerlessLanPathTests \
            -only-testing:RAVENTests/RavenEnvelopeEndpointIngestTests \
            -only-testing:RAVENTests/RavenBleRvn1CarrierTests \
            -only-testing:RAVENTests/RavenEnvelopeChatWireTests \
            -only-testing:RAVENTests/ATSAMChainRatchetTests \
            -only-testing:RAVENTests/ATSAMIndexedSessionProfileTests \
            -only-testing:RAVENTests/ATSAMPairInitV1Tests \
            -only-testing:RAVENTests/ATSAMEndpointTransactionV1Tests \
            -only-testing:RAVENTests/ATSAMPairingRootAgreementTests \
            -only-testing:RAVENTests/RavenEnvelopeBridgeServiceTests \
            -only-testing:RAVENTests/MeshInteropVectorsTests \
            -only-testing:RAVENTests/RavenContactRequestV1Tests \
            -only-testing:RAVENTests/ContactRequestInboxTests \
            -only-testing:RAVENTests/RavenServerlessLanSettingsTests \
            -only-testing:RAVENTests/MessagingProductBoundaryTests
      - name: LAN handshake KAT + Release lab gate (scripted)
        run: bash ../../node/scripts/ios_lan_kat.sh
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
      - name: Prove XCTest host stayed offline
        run: |
          set -euo pipefail
          RESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Logs/Test/*.xcresult' -type d -print0 \
            | xargs -0 stat -f '%m %N' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)
          test -n "$RESULT"
          xcrun xcresulttool get test-results tests --path "$RESULT" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          names = set()
          failures = []
          def walk(value):
              if isinstance(value, dict):
                  name = value.get("name")
                  if isinstance(name, str):
                      names.add(name)
                  status = value.get("testStatus") or value.get("status")
                  if isinstance(status, str) and status.lower() in {"failed", "failure"}:
                      failures.append(name or "unnamed test")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          required = {
              "testAppHostRecognizesXCTestAndSuppressesExternalSideEffects()",
              "testAppStartupNeverReachedAnExternalSideEffectBoundary()",
              "testRuntimeDetectorDoesNotDisableProductionShapedLaunch()",
          }
          missing = required - names
          if failures or missing:
              raise SystemExit(f"offline XCTest proof missing={sorted(missing)} failures={failures}")
          print("offline XCTest proof present")
          '
      - name: Release build (unsafe demo crypto must stay unavailable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO
