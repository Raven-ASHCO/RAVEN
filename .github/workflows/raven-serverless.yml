# Raven serverless node CI — B1-required product / terminal-path gates.
# Lab / experimental jobs live in raven-serverless-lab.yml so a lab failure
# cannot fail this workflow conclusion.
# Thin always-on companion: raven-b1-always-on.yml (`B1 always-on gate`).
name: Raven Serverless Node

on:
  # No path filters on the B1 product workflow. Docs-only PRs still get
  # conclusions for Messaging / Secret / Rust job names after required-check
  # pin. Lab stays path-filtered in raven-serverless-lab.yml.
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository. Third-party actions are
# pinned to full commit SHAs (the comment names the release); bump them
# deliberately. RUST_TOOLCHAIN pins rustc/clippy so a new stable release cannot
# change CI results without a code change — raven-toolchain-canary.yml tracks
# latest stable separately.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"

concurrency:
  group: raven-serverless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree-presence:
    name: Detect optional product trees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      libp2p_bridge: ${{ steps.detect.outputs.libp2p_bridge }}
      ios_app: ${{ steps.detect.outputs.ios_app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: detect
        name: Record whether iOS / Libp2pBridge trees exist
        run: |
          set -euo pipefail
          if [[ -f ios-native/RAVEN/Libp2pBridge/go.mod ]]; then
            echo "libp2p_bridge=true" >> "$GITHUB_OUTPUT"
            echo "Libp2pBridge present"
          else
            echo "libp2p_bridge=false" >> "$GITHUB_OUTPUT"
            echo "Libp2pBridge absent on this tree — Go libp2p bridge security will skip"
          fi
          if [[ -f ios-native/RAVEN/RAVEN.xcodeproj/project.pbxproj ]]; then
            echo "ios_app=true" >> "$GITHUB_OUTPUT"
            echo "ios-native/RAVEN present"
          else
            echo "ios_app=false" >> "$GITHUB_OUTPUT"
            echo "ios-native/RAVEN absent on this tree — iOS protocol security tests will skip"
          fi
      # A skipped job looks green in the checks list. Say loudly which
      # security suites did NOT run on this tree.
      - name: Coverage manifest (skipped security suites)
        run: |
          set -euo pipefail
          echo "## Security suites NOT exercised on this tree" >> "$GITHUB_STEP_SUMMARY"
          if [[ ! -f ios-native/RAVEN/Libp2pBridge/go.mod ]]; then
            echo "- go-bridge (Go libp2p bridge security): ios-native/RAVEN/Libp2pBridge absent" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Coverage gap::Go libp2p bridge security tests skipped (tree absent)"
          fi
          if [[ ! -f ios-native/RAVEN/RAVEN.xcodeproj/project.pbxproj ]]; then
            echo "- ios-security (iOS protocol security + Swift rvn1 vector parity): ios-native/RAVEN absent" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Coverage gap::iOS/Swift protocol security and vector parity skipped (tree absent)"
          fi

  messaging-product-boundary:
    name: Messaging-only product boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Refuse public-social product regressions
        run: bash node/scripts/messaging_product_boundary_gate.sh

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run secret history scan (CI mode)
        run: bash scripts/secret_history_scan.sh --ci

  harness-integrity:
    name: Harness self-tests + protocol freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Protocol freeze hashes (docs/PROTOCOL_FREEZE_HASHES_V1.md)
        run: bash scripts/freeze_protocol_hashes.sh --check
      - name: No diverging docs/ duplicates under node/
        run: bash scripts/check_doc_pointers.sh
      # Proves a failing assertion inside a step turns the harness red (the
      # historical `( ... ) && ok || fail` form silently ignored it).
      - name: Proof / reliability harness self-tests
        run: |
          set -euo pipefail
          bash scripts/final_serverless_proof.sh --self-test
          bash scripts/reliability_matrix_20.sh --self-test
          bash scripts/harness_util_selftest.sh
      # The secret scanner must still see a real seed after many allow-listed RFC 8032
      # test seeds, and the O6 IPC-surface guard must fire on an injected forbidden op
      # (both used to be silent no-ops). Neither writes anything. The Keychain guard
      # check keeps every macOS Keychain call behind macos_keychain::guarded.
      - name: Scanner / guard self-tests (secret scan, O6 IPC guard, Keychain guard)
        run: |
          set -euo pipefail
          bash scripts/secret_history_scan.sh --self-test
          bash scripts/o6_m1_same_rvn1_bind_check.sh --self-test
          bash scripts/keychain_guard_check.sh --self-test
          bash scripts/keychain_guard_check.sh
      # R1 stop-line (docs/design/2026-10-linux-keystore.md): Secret Service only
      # through the frozen no-prompt fork, no-prompt APIs only in the approved
      # wrapper (identity_store.rs), never Unlock / a plain session.
      - name: Secret Service R1 boundary (static)
        run: |
          set -euo pipefail
          bash node/scripts/secret_service_r1_boundary_check.sh --self-test
          bash node/scripts/secret_service_r1_boundary_check.sh
      - name: shellcheck (errexit pitfalls + harness warnings)
        run: |
          set -euo pipefail
          shellcheck --version
          # SC2251: a bare `! cmd` never trips errexit, so it asserts nothing.
          shellcheck --include=SC2251 scripts/*.sh scripts/lib/*.sh scripts/release/*.sh \
            node/scripts/*.sh node/scripts/install/*.sh
          shellcheck -S warning \
            scripts/final_serverless_proof.sh scripts/reliability_matrix_20.sh \
            scripts/lib/proof_assert.sh scripts/freeze_protocol_hashes.sh scripts/check_doc_pointers.sh \
            scripts/secret_history_scan.sh scripts/release/*.sh node/scripts/install/*.sh \
            node/scripts/lan_path_smoke.sh node/scripts/bridge_abc_demo.sh \
            node/scripts/two_node_demo.sh node/scripts/internet_dial_smoke.sh \
            node/scripts/libp2p_swarm_smoke.sh node/scripts/mailbox_opaque_smoke.sh \
            node/scripts/bootstrap_manual_peer_smoke.sh node/scripts/internet_indexed_two_node.sh \
            node/scripts/lan_direct_two_node.sh

  # The ordinary SQLite amalgamation (~9.5 MB sqlite3.c) is compiled into every default
  # build and its SHA-256 pins live in the same repo (libsqlite3-sys-raven/build.rs), so
  # a commit that edits both builds green everywhere else. This ties the files AND the
  # pins to the checksummed crates.io libsqlite3-sys 0.38.2 archive. It is merge-blocking
  # only once this check is added to branch protection (the required-check pin is OFF).
  # curl is retried: a provenance MISMATCH fails the same way every attempt.
  supply-chain-provenance:
    name: Vendored SQLite provenance vs crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: libsqlite3-sys-raven ordinary SQLite vs checksummed crates.io archive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash node/scripts/verify_sqlcipher_fork_ordinary_sqlite_upstream.sh; then
              exit 0
            fi
            echo "provenance verifier attempt $attempt failed" >&2
            sleep $((attempt * 5))
          done
          exit 1

  # The §59 harness cited by README.md. Lab build (unsafe-demo-crypto); exits 1
  # unless every step is green. Artifacts hold public keys only.
  final-serverless-proof:
    name: Final serverless proof (lab harness)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
          prefix-key: final-serverless-proof
      - name: Run scripts/final_serverless_proof.sh
        run: bash scripts/final_serverless_proof.sh
      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-serverless-proof
          path: |
            node/proof_artifacts/
            !node/proof_artifacts/LATEST
          if-no-files-found: warn

  rust-linux:
    name: Rust + vectors (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Headless runner: no Secret Service. Debug CI keeps the lab locked-file
    # backend so cargo test --locked / ash init create ephemeral identities; the
    # Release keystore (passphrase vault) is proven by linux-release-keystore.
    env:
      RAVEN_IDENTITY_BACKEND: locked-file
      RAVEN_ALLOW_EPHEMERAL_DATA_DIR: "1"
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: |
          cargo clippy --locked -p raven-core -p ash -p raven-node -p raven-swarm --all-targets -- -D warnings
          cargo clippy --locked -p raven-swarm --all-features --all-targets -- -D warnings
          # Non-default debug / experimental features that ship in debug builds.
          cargo clippy --locked -p ash -p raven-node --all-targets \
            --features ash/debug-trace-delivery,raven-node/corebluetooth -- -D warnings
      - name: fuzz targets type-check (cargo-fuzz crate, stable)
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --lib --bins -- -D warnings
      - name: RustSec active dependency audit
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked --version 0.22.2
          python3 -m unittest scripts/test_audit_active_dependencies.py
          python3 scripts/audit_active_dependencies.py
      # The lab SQLCipher provider (bundled-sqlcipher*, full-braid-durable-lab)
      # must never reach a shipped package's resolved feature graph. The script
      # also self-tests that it fires on raven-core's lab feature graph, and asserts
      # that libsqlite3-sys still resolves to the audited path fork (node + node/fuzz
      # lockfiles): a rusqlite bump that drops the [patch] fails here.
      - name: SQLCipher lab provider absent from release feature graphs
        run: bash scripts/sqlcipher_release_feature_audit.sh
      - name: test raven-core + ash
        run: cargo test --locked -p raven-core -p ash -p raven-node
      # CLI DX: menu/CLI smoke only (not Keychain / launchd / Gatekeeper).
      # Must stay on script-default target/debug/ash — locked-file is refused in Release.
      # Script uses RAVEN_IDENTITY_BACKEND=locked-file and ephemeral mktemp dirs.
      - name: ash menu smoke
        run: ./scripts/ash_menu_smoke.sh
      - name: LAN handshake KAT (shared vectors, no live network)
        run: cargo test --locked -p raven-core --lib lan_
      # Must stay on script-default target/debug — locked-file is refused in Release.
      # Script uses RAVEN_IDENTITY_BACKEND=locked-file and
      # RAVEN_CHAT_HISTORY_BACKEND=locked-file so GNU/Linux SS connect-fail
      # can persist chat-history (not a production 0600-key fallback).
      - name: LAN direct two-node smoke
        run: ./scripts/lan_direct_two_node.sh
      # Portable carrier harness (transports design §6.4): two real raven-node
      # services + `raven send` each way + inbox (C1) and a stranger refused
      # before the responder identifies itself (C3, F4); C2 does the same over
      # Internet direct (listeners on 127.0.0.1 and [::1], contacts with only
      # Internet routes, debug lab unlock while the P1 flag is off). Rust, not
      # bash, so the same scenario runs on all three runners (named-pipe IPC on
      # Windows).
      - name: Portable carrier harness (C1 LAN direct + C2 Internet direct both ways + C3 contact gating)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ash -p raven-node
          cargo test --locked -p raven-node --test carrier_matrix -- --ignored --nocapture
      - name: bridge + fuzz smoke
        run: cargo test --locked -p raven-core --test bridge_v1 --test fuzz_smoke
      - name: 10,000-message queue reliability gate
        run: cargo test --locked -p raven-core --test reliability_10k -- --ignored
      - name: Deterministic 1,000-node adversarial DTN simulation
        run: |
          cargo test --locked -p raven-core --test network_sim_1000
          cargo test --locked --release -p raven-core --test network_sim_1000
      - name: build swarm
        run: cargo build --locked -p raven-swarm -p raven-node
      - name: experimental mailbox/NAT tests (still production-disabled)
        run: |
          set -euo pipefail
          expect_failure_with_message() {
            expected="$1"
            shift
            log="$(mktemp)"
            if "$@" >"$log" 2>&1; then
              echo "security hold unexpectedly allowed command: $*" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- "$expected" "$log"; then
              echo "command failed without the expected security-hold diagnostic: $*" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          }
          cargo test --locked -p raven-swarm --all-features --all-targets
          cargo build --locked --release -p raven-swarm \
            --features experimental-offline-mailbox \
            --bin raven-swarm-mailbox-experimental
          cargo build --locked --release -p raven-swarm \
            --features experimental-nat-connectivity \
            --bin raven-swarm-connectivity-experimental
          expect_failure_with_message \
            "security hold: pass --allow-experimental-mailbox explicitly" \
            target/release/raven-swarm-mailbox-experimental \
            serve --data-dir target/ci-mailbox-security-hold --timeout-secs 1
          expect_failure_with_message \
            "experimental NAT connectivity requires explicit runtime opt-in" \
            target/release/raven-swarm-connectivity-experimental --run-seconds 1
      - name: release crypto feature gate
        run: |
          set -euo pipefail
          cargo build --locked --release -p raven-core -p raven-node -p ash
          for package in raven-core raven-node ash; do
            log="$(mktemp)"
            if cargo build --locked --release -p "$package" --features unsafe-demo-crypto >"$log" 2>&1; then
              echo "unsafe-demo-crypto unexpectedly linked into $package release" >&2
              rm -f "$log"
              exit 1
            fi
            if ! grep -Fq -- \
              "unsafe-demo-crypto is forbidden in release builds" "$log"; then
              echo "unsafe-demo-crypto gate for $package failed for an unrelated reason" >&2
              tail -n 80 "$log" >&2
              rm -f "$log"
              exit 1
            fi
            rm -f "$log"
          done
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh
      # Software A–B–C mock_ble (TCP stand-in). Debug locked-file only —
      # not a production Secret Service claim; not Byzantine / flood-proof.
      # Must stay on script-default target/debug — locked-file is refused in Release.
      # Script always rebuilds with unsafe-demo-crypto for --body-mode unsafe-interim.
      - name: bridge A-B-C demo (mock_ble)
        run: ./scripts/bridge_abc_demo.sh
      - name: mailbox opaque put/get smoke
        run: ./scripts/mailbox_opaque_smoke.sh
      - name: libp2p offline mailbox restart smoke
        run: ./scripts/swarm_mailbox_smoke.sh
      - name: legacy Internet path remains fail-closed
        run: ./scripts/internet_dial_smoke.sh
      # Positive lab path: RIH1 + indexed PairInit/ACK on 127.0.0.1.
      # CLAIM: localhost/lab ≠ WAN / multi-NAT Proven. Production flag stays false.
      - name: InternetTransport localhost indexed two-node (lab; not WAN)
        run: ./scripts/internet_indexed_two_node.sh
        env:
          RAVEN_IDENTITY_BACKEND: locked-file
          RAVEN_ALLOW_EPHEMERAL_DATA_DIR: "1"
          RAVEN_LAB_TEST_A: "1"
      - name: protocol vectors (python)
        working-directory: protocol/reference
        run: |
          python3 -m pip install -q -r requirements.txt
          python3 -m pytest -q
          python3 generate_rvn1.py
          git diff --exit-code -- ../../shared-vectors/rvn1
          test -z "$(git ls-files --others --exclude-standard -- ../../shared-vectors/rvn1)"
      - name: SBOM (cargo tree --locked + cyclonedx if available)
        run: |
          set -euo pipefail
          mkdir -p target/sbom
          cargo tree --locked -p raven-core -p ash -p raven-node -p raven-swarm --prefix depth \
            > target/sbom/raven-cargo-tree.txt
          if cargo install --list 2>/dev/null | grep -q '^cargo-cyclonedx '; then
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json || true
          else
            cargo install cargo-cyclonedx --locked --version 0.5.7 || true
            cargo cyclonedx -p raven-core --format json --output-cdx target/sbom/raven-core.cdx.json \
              || echo "cyclonedx optional — cargo-tree SBOM retained"
          fi
          test -s target/sbom/raven-cargo-tree.txt
          ls -la target/sbom/
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: raven-sbom-linux
          path: node/target/sbom/
          if-no-files-found: error

  # RELEASE-build proof of the Linux keystore (R1, docs/design/2026-10-linux-keystore.md):
  # no lab backend env. Two profiles on the passphrase vault (passphrase files in a
  # temp dir), two raven-node services on 127.0.0.1, contacts, `raven send` each way,
  # inbox check, plus the refusal paths (no passphrase on a non-TTY, env passphrase,
  # loose file mode, wrong passphrase, backend switch, Release locked-file).
  linux-release-keystore:
    name: Linux Release keystore smoke (passphrase vault)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
          prefix-key: linux-release-keystore
      - name: Release build (locked)
        run: cargo build --locked --release -p raven-node -p ash
      - name: Two-node Release smoke over the passphrase vault
        run: bash scripts/linux_release_keystore_two_node.sh

  # Same Release smoke inside a headless, unlocked GNOME Keyring (dbus-run-session +
  # gnome-keyring-daemon --unlock with a throwaway test password). Advisory until it
  # has run green on the hosted image: a provider quirk must not block the vault proof.
  linux-release-keystore-secret-service:
    name: Linux Release keystore smoke (Secret Service, headless gnome-keyring)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
          prefix-key: linux-release-keystore
      - name: Install headless Secret Service provider
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring dbus dbus-x11
      - name: Release build (locked)
        run: cargo build --locked --release -p raven-node -p ash
      - name: Two-node Release smoke over Secret Service
        run: |
          set -euo pipefail
          dbus-run-session -- bash -c '
            set -euo pipefail
            printf "%s" "raven-ci-throwaway-keyring" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL
            bash scripts/linux_release_keystore_two_node.sh --secret-service
          '

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
      - name: test raven-core + ash + swarm build
        run: |
          cargo test --locked -p raven-core -p ash -p raven-node
          cargo test --locked -p raven-core --lib lan_
          cargo build --locked -p raven-swarm -p raven-node
          cargo build --locked --release -p raven-core -p raven-node -p ash
      # CLI DX: menu/CLI smoke only (not Keychain / launchd / Gatekeeper).
      # Must stay on script-default target/debug/ash — locked-file is refused in Release.
      # locked-file avoids Keychain ACL hangs in CI — not a production Keychain claim.
      - name: ash menu smoke
        run: ./scripts/ash_menu_smoke.sh
      # Named reliability gates (Sprint 0 evidence bar). reliability_10k is
      # #[ignore] and is NOT run by the umbrella cargo test --locked above.
      # reliability_10k on macOS is QUEUE DURABILITY ONLY — not a path proof.
      # Path proof: named bridge_v1 (this job) and/or ash_menu_smoke (CLI DX #16).
      - name: 10,000-message queue reliability gate
        run: |
          set -euo pipefail
          cargo test --locked -p raven-core --test reliability_10k -- --ignored
      - name: bridge_v1 (pure Rust)
        run: |
          set -euo pipefail
          cargo test --locked -p raven-core --test bridge_v1
      - name: libp2p swarm smoke
        run: ./scripts/libp2p_swarm_smoke.sh
      - name: bootstrap manual-peer smoke
        run: ./scripts/bootstrap_manual_peer_smoke.sh
      - name: InternetTransport localhost indexed two-node (lab; not WAN)
        run: ./scripts/internet_indexed_two_node.sh
        env:
          RAVEN_IDENTITY_BACKEND: locked-file
          RAVEN_ALLOW_EPHEMERAL_DATA_DIR: "1"
          RAVEN_LAB_TEST_A: "1"
      # Portable carrier harness (transports design §6.4): two real raven-node
      # services + `raven send` each way + inbox (C1) and a stranger refused
      # before the responder identifies itself (C3, F4); C2 does the same over
      # Internet direct (listeners on 127.0.0.1 and [::1], contacts with only
      # Internet routes, debug lab unlock while the P1 flag is off). Rust, not
      # bash, so the same scenario runs on all three runners (named-pipe IPC on
      # Windows).
      - name: Portable carrier harness (C1 LAN direct + C2 Internet direct both ways + C3 contact gating)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ash -p raven-node
          cargo test --locked -p raven-node --test carrier_matrix -- --ignored --nocapture

  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
      # The runner's git defaults to core.autocrlf=true. build.rs hashes the ordinary
      # SQLite amalgamation on every build and the protocol freeze manifest hashes
      # protocol/ + shared-vectors/ byte for byte, so a CRLF checkout of any of them
      # breaks the build with an opaque hash panic. .gitattributes pins them to LF /
      # -text; fail here first with a clear message if that ever regresses.
      - name: Byte-pinned inputs are LF in this checkout (core.autocrlf guard)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          bad="$(git ls-files --eol -- node/third_party protocol shared-vectors \
            | awk '$1 == "i/lf" && $2 != "w/lf" && $2 != "w/none"' || true)"
          if [[ -n "$bad" ]]; then
            echo "files that are LF in the index but not LF in the working tree (check .gitattributes / core.autocrlf):" >&2
            echo "$bad" | head -n 20 >&2
            exit 1
          fi
          echo "byte-pinned paths are LF in the working tree"
      - name: test raven-core + ash
        run: |
          cargo test --locked -p raven-core -p ash -p raven-node
          cargo build --locked -p ash -p raven-node -p raven-swarm
          cargo build --locked --release -p raven-core -p raven-node -p ash
      # Named reliability gates (Sprint 0 evidence bar). cargo, not bash.
      # reliability_10k on Windows is QUEUE DURABILITY ONLY — not a path proof.
      # Path proof: named bridge_v1 + ash_doctor_send_smoke.ps1 (this job).
      - name: 10,000-message queue reliability gate
        run: cargo test --locked -p raven-core --test reliability_10k -- --ignored
      - name: bridge_v1 (pure Rust)
        run: cargo test --locked -p raven-core --test bridge_v1
      # Portable carrier harness (transports design §6.4): two real raven-node
      # services + `raven send` each way + inbox (C1) and a stranger refused
      # before the responder identifies itself (C3, F4); C2 does the same over
      # Internet direct (listeners on 127.0.0.1 and [::1], contacts with only
      # Internet routes, debug lab unlock while the P1 flag is off). Rust, not
      # bash, so the same scenario runs on all three runners (named-pipe IPC on
      # Windows).
      - name: Portable carrier harness (C1 LAN direct + C2 Internet direct both ways + C3 contact gating)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ash -p raven-node
          cargo test --locked -p raven-node --test carrier_matrix -- --ignored --nocapture
      - name: ash doctor→send smoke (Windows terminal path)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = 'scripts/ash_doctor_send_smoke.ps1'
          if (-not (Test-Path -LiteralPath $script)) {
            Write-Error "$script missing — refusing silent skip"
            exit 1
          }
          & $script
          if ($null -ne $LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: ash / raven-node --help (terminal smoke)
        shell: pwsh
        run: |
          if (-not (Test-Path "target\debug\ash.exe")) { throw "missing target/debug/ash.exe" }
          if (-not (Test-Path "target\debug\raven-node.exe")) { throw "missing target/debug/raven-node.exe" }
          & ".\target\debug\ash.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "ash --help failed" }
          & ".\target\debug\raven-node.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "raven-node --help failed" }
          Write-Host "Windows terminal --help OK"
      - name: ash menu smoke
        shell: bash
        run: ./scripts/ash_menu_smoke.sh
      - name: PowerShell install script syntax check
        shell: pwsh
        run: |
          Get-Command Get-Content | Out-Null
          $p = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $p)) { throw "missing $p" }
          # Parse-only: ensure script is well-formed PowerShell.
          # pwsh 7 requires [ref] targets to exist before ParseFile.
          $tokens = $null
          $errs = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $p), [ref]$tokens, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_ }; throw "parse errors" }
          Write-Host "windows_service.ps1 OK"
      - name: windows_service.ps1 exercise (temp dirs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-service-exercise"
          $dataDir = Join-Path $root "data"
          $binDir = Join-Path $root "bin"
          try {
            New-Item -ItemType Directory -Force -Path $dataDir, $binDir | Out-Null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask
            foreach ($name in @("raven-node.exe", "ash.exe", "raven.exe")) {
              $path = Join-Path $binDir $name
              if (-not (Test-Path -LiteralPath $path)) { throw "missing $path" }
              Write-Host "ok $path"
            }
          } finally {
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      # Upgrade path + task settings of the logon-task installer (never exercised by the
      # -SkipScheduledTask run above):
      #  * a running CLI session holds ash.exe open: Windows refuses to overwrite a running
      #    image but allows renaming it (FileShare.Delete models exactly that), so the
      #    installer must move it aside (ash.exe.old) instead of aborting on Copy-Item;
      #  * the task must register with no execution time limit (PT0S): the Task Scheduler
      #    default of 72h silently stops the always-on daemon after three days. A uniquely
      #    named task is registered with -NoStart and always unregistered.
      - name: windows_service.ps1 upgrade path + logon-task settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $script = "scripts/install/windows_service.ps1"
          if (-not (Test-Path $script)) { throw "missing $script" }
          $root = Join-Path $env:RUNNER_TEMP "raven-windows-service-upgrade"
          $dataDir = Join-Path $root "data"
          $binDir = Join-Path $root "bin"
          $taskName = "RavenNodeBridgeCI-$PID"
          $hold = $null
          try {
            New-Item -ItemType Directory -Force -Path $dataDir, $binDir | Out-Null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask
            $ash = Join-Path $binDir "ash.exe"
            $hold = [System.IO.File]::Open($ash, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, [System.IO.FileShare]::Delete)
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -SkipScheduledTask
            if (-not (Test-Path -LiteralPath "$ash.old")) { throw "locked ash.exe was not moved aside to ash.exe.old" }
            if (-not (Test-Path -LiteralPath $ash)) { throw "ash.exe missing after upgrade over a locked copy" }
            $hold.Dispose()
            $hold = $null
            & (Resolve-Path $script) -DataDir $dataDir -BinDir $binDir -TaskName $taskName -NoStart -InternetListen 127.0.0.1:7422
            $task = Get-ScheduledTask -TaskName $taskName
            # -InternetListen is opt-in and lands on the task's command line verbatim.
            $taskArgs = [string]$task.Actions[0].Arguments
            if ($taskArgs -notmatch '--internet-listen 127\.0\.0\.1:7422') { throw "task arguments lack --internet-listen: $taskArgs" }
            $limit = [string]$task.Settings.ExecutionTimeLimit
            if ($limit -ne "PT0S") { throw "ExecutionTimeLimit is '$limit', expected PT0S (no limit)" }
            if ($task.Settings.StartWhenAvailable -ne $true) { throw "StartWhenAvailable is not set" }
            if ([int]$task.Settings.RestartCount -lt 3) { throw "RestartCount is $($task.Settings.RestartCount), expected restart-on-failure" }
            if ([string]$task.State -eq "Running") { throw "-NoStart started the task" }
            Write-Host "logon task settings OK (PT0S, StartWhenAvailable, restart-on-failure, -InternetListen)"
          } finally {
            if ($null -ne $hold) { $hold.Dispose() }
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $root) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
      - name: bootstrap manual-peer smoke
        shell: bash
        run: ./scripts/bootstrap_manual_peer_smoke.sh

  go-bridge:
    name: Go libp2p bridge security
    needs: tree-presence
    if: needs.tree-presence.outputs.libp2p_bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ios-native/RAVEN/Libp2pBridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ios-native/RAVEN/Libp2pBridge/go.mod
          cache-dependency-path: ios-native/RAVEN/Libp2pBridge/go.sum
      - name: Unit, adversarial, and race tests
        run: go test -count=1 -race ./...
      - name: Vet
        run: go vet ./...

  ios-security:
    name: iOS protocol security tests
    needs: tree-presence
    if: needs.tree-presence.outputs.ios_app == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios-native/RAVEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select an available iOS simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          candidates = [
              (runtime, d)
              for runtime, devices in data.items()
              for d in devices
              if d.get("isAvailable") and "iPhone" in d.get("name", "")
          ]
          if not candidates:
              raise SystemExit("no available iPhone simulator")
          # Runtime identifiers end in a dotted version with dashes. Prefer
          # the newest available runtime instead of relying on JSON order.
          def version(item):
              raw = item[0].rsplit("iOS-", 1)[-1]
              return tuple(int(part) for part in raw.split("-") if part.isdigit())
          print(max(candidates, key=version)[1]["udid"])
          ')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and run protocol security tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -parallel-testing-enabled NO \
            -only-testing:RAVENTests/RavenEnvelopeV1VectorsTests \
            -only-testing:RAVENTests/RavenServerlessLanPathTests \
            -only-testing:RAVENTests/RavenEnvelopeEndpointIngestTests \
            -only-testing:RAVENTests/RavenBleRvn1CarrierTests \
            -only-testing:RAVENTests/RavenEnvelopeChatWireTests \
            -only-testing:RAVENTests/ATSAMChainRatchetTests \
            -only-testing:RAVENTests/ATSAMIndexedSessionProfileTests \
            -only-testing:RAVENTests/ATSAMPairInitV1Tests \
            -only-testing:RAVENTests/ATSAMEndpointTransactionV1Tests \
            -only-testing:RAVENTests/ATSAMPairingRootAgreementTests \
            -only-testing:RAVENTests/RavenEnvelopeBridgeServiceTests \
            -only-testing:RAVENTests/MeshInteropVectorsTests \
            -only-testing:RAVENTests/RavenContactRequestV1Tests \
            -only-testing:RAVENTests/ContactRequestInboxTests \
            -only-testing:RAVENTests/RavenServerlessLanSettingsTests \
            -only-testing:RAVENTests/MessagingProductBoundaryTests
      - name: LAN handshake KAT + Release lab gate (scripted)
        run: bash ../../node/scripts/ios_lan_kat.sh
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
      - name: Prove XCTest host stayed offline
        run: |
          set -euo pipefail
          RESULT=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Logs/Test/*.xcresult' -type d -print0 \
            | xargs -0 stat -f '%m %N' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-)
          test -n "$RESULT"
          xcrun xcresulttool get test-results tests --path "$RESULT" \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          names = set()
          failures = []
          def walk(value):
              if isinstance(value, dict):
                  name = value.get("name")
                  if isinstance(name, str):
                      names.add(name)
                  status = value.get("testStatus") or value.get("status")
                  if isinstance(status, str) and status.lower() in {"failed", "failure"}:
                      failures.append(name or "unnamed test")
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(data)
          required = {
              "testAppHostRecognizesXCTestAndSuppressesExternalSideEffects()",
              "testAppStartupNeverReachedAnExternalSideEffectBoundary()",
              "testRuntimeDetectorDoesNotDisableProductionShapedLaunch()",
          }
          missing = required - names
          if failures or missing:
              raise SystemExit(f"offline XCTest proof missing={sorted(missing)} failures={failures}")
          print("offline XCTest proof present")
          '
      - name: Release build (unsafe demo crypto must stay unavailable)
        run: |
          set -o pipefail
          xcodebuild build \
            -project RAVEN.xcodeproj \
            -scheme RAVEN \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            CODE_SIGNING_ALLOWED=NO
