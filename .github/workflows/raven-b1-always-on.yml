# Thin always-on B1 gate. No path filters: docs-only PRs still get a required
# status after required-check pin. Not Full Braid / ML-KEM lab.
# Target: under two minutes. Full terminal Rust suite lives on
# Raven Serverless Node (also unfiltered so those names always report).
name: Raven B1 Always-On

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: raven-b1-always-on-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b1-always-on:
    name: B1 always-on gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret history scan (CI mode)
        run: bash scripts/secret_history_scan.sh --ci
      - name: Messaging-only product boundary
        run: bash node/scripts/messaging_product_boundary_gate.sh
      - name: rustfmt when the node tree is present
        if: hashFiles('node/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        if: hashFiles('node/Cargo.toml') != ''
        working-directory: node
        run: cargo fmt --all -- --check
