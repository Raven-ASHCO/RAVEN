# Always-on B1 gate. No path filters: docs-only PRs still get a required
# status. Runnable terminal smoke bots can re-trigger via workflow_dispatch.
# Secret scan + messaging boundary + rustfmt + ash/raven-node --help/whoami/
# timed listen. Not Full Braid / ML-KEM lab. Cross-OS proof stays on
# Raven Serverless Node (Linux/macOS/Windows).
name: Raven B1 Always-On

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository. Third-party actions are
# pinned to full commit SHAs (the comment names the release); bump them
# deliberately. RUST_TOOLCHAIN pins rustc/clippy so a new stable release cannot
# change CI results without a code change — raven-toolchain-canary.yml tracks
# latest stable separately.
permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"

concurrency:
  group: raven-b1-always-on-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b1-always-on:
    name: B1 always-on gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret history scan (CI mode)
        run: bash scripts/secret_history_scan.sh --ci
      - name: Messaging-only product boundary
        run: bash node/scripts/messaging_product_boundary_gate.sh
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: node
          prefix-key: b1-always-on
      - name: rustfmt (shipping crates)
        working-directory: node
        run: cargo fmt --all -- --check
      - name: Terminal ash/raven-node smoke
        working-directory: node
        run: bash ./scripts/terminal_help_smoke.sh
